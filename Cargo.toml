[package]
name = "adb-broadcast-sender"
version = "1.0.0"
edition = "2021"
authors = ["adb-broadcast-sender"]
description = "ADB Broadcast Sender - Desktop client for sending ADB broadcast intents"

[dependencies]
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
qrcode = "0.14"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = true
